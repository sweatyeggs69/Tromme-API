name = "tromme-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "api.tromme.app", custom_domain = true }
]

[observability]
enabled = true

# Per-client limit, keyed on IP in src/index.js. Cache hits are not counted.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 200
  period = 60

# Secrets (set with `wrangler secret put`): LASTFM_API_KEY, TICKETMASTER_API_KEY

# Global budget for bulk requests (x-tromme-bulk: 1), see src/bulk-budget.js.
[[durable_objects.bindings]]
name = "BULK_BUDGET"
class_name = "BulkBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BulkBudget"]
